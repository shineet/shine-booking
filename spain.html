<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spain">
<meta name="theme-color" content="#faf8f2">
<title>Spain</title>
<style>
  :root {
    --bg:#faf8f2; --card:#fffdf8; --ink:#2b2b2b; --muted:#8a8578;
    --line:#e7e2d6; --accent:#c0562e; --good:#3f7d4e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 40px);
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 0 14px; }

  header { padding: 16px 0 10px; display: flex; align-items: baseline; gap: 10px; }
  header h1 { font-size: 24px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  header .sub { color: var(--muted); font-size: 14px; }
  #status { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }

  .who {
    display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted);
    padding: 0 0 12px; border-bottom: 1px solid var(--line); margin-bottom: 14px;
  }
  .who b { color: var(--ink); font-weight: 600; }
  .linkish { color: var(--accent); font-weight: 600; background: none; border: 0; padding: 0; font-size: 13px; }

  .day, .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 14px; overflow: hidden; }
  .day-head, .card-head { display: flex; align-items: baseline; gap: 8px; padding: 12px 14px 10px; border-bottom: 1px solid var(--line); }
  .day-head .d, .card-head .d { font-weight: 700; font-size: 16px; }
  .day-head .city { color: var(--accent); font-weight: 600; font-size: 14px; }
  .day-head .n, .card-head .n { margin-left: auto; font-size: 12px; color: var(--muted); }
  /* Today, so it is obvious why the page opened where it did. */
  .day.today { border-color: var(--accent); }
  .day-head .now {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: #fff; background: var(--accent); border-radius: 999px; padding: 2px 8px;
  }

  .item { display: flex; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); align-items: flex-start; }
  .item:last-child { border-bottom: 0; }
  .item .t { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); min-width: 68px; padding-top: 2px; }
  .item .body { flex: 1; min-width: 0; }
  .item .title { font-weight: 600; }
  .item .detail, .item .by { font-size: 13px; color: var(--muted); }
  .item .detail { white-space: pre-wrap; word-break: break-word; }
  .item.booked .title { color: var(--good); }
  .tag { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .map { font-size: 13px; color: var(--accent); text-decoration: none; font-weight: 600; }
  /* A deliberate target, not the whole row.
     The row used to be the button, so reading the plan and opening an editor
     with a Delete in it were the same gesture. This page is mostly read, by
     eight people, on phones. */
  .item .edit {
    flex: 0 0 auto; width: 44px; height: 44px; margin: -6px -6px -6px 0;
    background: none; border: 0; color: var(--muted); font-size: 17px;
    display: flex; align-items: center; justify-content: center; border-radius: 10px;
  }
  .item .edit:active, .item .cost:active { background: var(--line); }
  /* Sits beside the pencil. Says "cost" rather than a currency symbol, because
     an expense can be in either currency and the sheet asks which. */
  .item .cost {
    flex: 0 0 auto; height: 44px; padding: 0 8px; margin: -6px 0;
    background: none; border: 0; color: var(--accent); font-size: 13px; font-weight: 600;
    border-radius: 10px;
  }
  .add { display: block; width: 100%; text-align: left; padding: 11px 14px; background: none; border: 0; color: var(--accent); font-size: 15px; font-weight: 600; }
  .empty { padding: 12px 14px; color: var(--muted); font-size: 14px; }

  /* Editor sheet */
  #sheet { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: flex-end; z-index: 20; }
  #sheet.open { display: flex; }
  #sheet .panel {
    background: var(--card); width: 100%; max-height: 92vh; overflow: auto;
    border-radius: 18px 18px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom));
    max-width: 680px; margin: 0 auto;
  }
  #sheet h3 { margin: 0 0 12px; font-size: 17px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  /* type=time has to be listed too. It is not a text input, so it was falling
     back to its own cramped default width beside a full width Kind select. */
  input[type=text], input[type=time], input[type=date], textarea, select {
    width: 100%; font: 16px/1.5 inherit; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink);
  }
  textarea { min-height: 76px; resize: vertical; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 15px; }
  .check input { width: 20px; height: 20px; }
  .actions { display: flex; gap: 10px; margin-top: 16px; }
  button.primary { flex: 1; background: var(--accent); color: #fff; border: 0; border-radius: 12px; padding: 13px; font-size: 16px; font-weight: 600; }
  button.ghost { background: none; border: 1px solid var(--line); border-radius: 12px; padding: 13px 16px; font-size: 16px; color: var(--ink); }
  button.danger { background: none; border: 0; color: #b03a2e; font-size: 15px; padding: 13px 4px; font-weight: 600; }

  /* Tabs */
  .tabs { display: flex; gap: 6px; margin: 0 0 14px; }
  .tabs button {
    flex: 1; padding: 9px; border: 1px solid var(--line); background: var(--card);
    border-radius: 11px; font-size: 15px; font-weight: 600; color: var(--muted);
  }
  .tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* Money */
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    border: 1px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 7px 13px; font-size: 14px; color: var(--ink);
  }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip.add { color: var(--accent); font-weight: 600; }
  .exp { display: flex; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); align-items: flex-start; }
  .exp:last-child { border-bottom: 0; }
  .exp .body { flex: 1; min-width: 0; }
  .exp .amt { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .exp .sub { font-size: 13px; color: var(--muted); }
  .owe { display: flex; align-items: baseline; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .owe:last-child { border-bottom: 0; }
  .owe .who { font-weight: 600; }
  .owe .amt { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent); }
  .settled { padding: 16px 14px; color: var(--good); font-weight: 600; }
  .totals { display: flex; gap: 0; padding: 12px 0 14px; }
  .totals div { flex: 1; text-align: center; }
  .totals .n { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .totals .l { font-size: 12px; color: var(--muted); }

  /* PIN gate */
  #gate { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 14px; padding: 24px; z-index: 30; }
  #gate h2 { margin: 0; font-weight: 700; }
  #gate p { margin: 0; color: var(--muted); font-size: 14px; text-align: center; }
  #gate input { font-size: 20px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 12px;
                text-align: center; width: 200px; letter-spacing: 4px; }
  #gate button { font-size: 16px; padding: 12px 28px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 600; }
  .err { color: #b03a2e; font-size: 13px; min-height: 16px; }
  .hidden { display: none !important; }
  .offline { background: #fdf3e7; border: 1px solid #e8d5bb; color: #8a5a2b; border-radius: 10px;
             padding: 8px 12px; font-size: 13px; margin-bottom: 12px; }
</style>
</head>
<body>

<div id="app" class="wrap hidden">
  <header>
    <h1>Spain</h1>
    <span class="sub" id="range"></span>
    <span id="status"></span>
  </header>

  <div class="who">
    <span>You are <b id="me">—</b></span>
    <button class="linkish" onclick="askName()">change</button>
    <span style="margin-left:auto"></span>
    <button class="linkish" onclick="shiftDates()">trip dates</button>
  </div>

  <div class="tabs">
    <button id="tab-plan" class="on" onclick="showTab('plan')">Plan</button>
    <button id="tab-money" onclick="showTab('money')">Money</button>
  </div>

  <div id="stale" class="offline hidden"></div>
  <div id="days"></div>

  <div id="money" class="hidden">
    <div class="totals">
      <div><div class="n" id="m-total">-</div><div class="l">spent together</div></div>
      <div><div class="n" id="m-each">-</div><div class="l">each, so far</div></div>
    </div>
    <div style="text-align:center;margin:-6px 0 14px">
      <button class="linkish" id="m-rate" onclick="editRate()"></button>
    </div>

    <div class="card">
      <div class="card-head"><span class="d">Who is splitting</span></div>
      <div style="padding:12px 14px"><div class="chips" id="m-people"></div></div>
    </div>

    <div class="card">
      <div class="card-head"><span class="d">Who owes whom</span><span class="n" id="m-count"></span></div>
      <div id="m-settle"></div>
    </div>

    <div class="card">
      <div class="card-head"><span class="d">Everything so far</span></div>
      <div id="m-list"></div>
      <button class="add" onclick="openExpense()">+  Add an expense</button>
    </div>
  </div>
</div>

<div id="sheet" onclick="if(event.target===this) closeSheet()">
  <div class="panel">
    <h3 id="sheet-title">Add to the plan</h3>
    <div class="row">
      <div>
        <label for="f-time">Time <button type="button" class="linkish" style="font-size:11px" onclick="document.getElementById('f-time').value=''">clear</button></label>
        <input id="f-time" type="time" autocomplete="off">
      </div>
      <div>
        <label for="f-cat">Kind</label>
        <select id="f-cat">
          <option value="plan">Plan</option>
          <option value="food">Food</option>
          <option value="travel">Travel</option>
          <option value="stay">Stay</option>
          <option value="note">Note</option>
        </select>
      </div>
    </div>
    <label for="f-title">What</label>
    <input id="f-title" type="text" placeholder="Prado Museum" autocomplete="off">
    <label for="f-place">Place or address</label>
    <input id="f-place" type="text" placeholder="Museo del Prado, or Calle Ruiz de Alarcon 23" autocomplete="off">
    <label for="f-detail">Notes</label>
    <textarea id="f-detail" placeholder="Tickets booked, meet in the lobby at 9…"></textarea>
    <label class="check"><input id="f-booked" type="checkbox"> Booked and paid</label>
    <div class="actions">
      <button class="ghost" onclick="closeSheet()">Cancel</button>
      <button class="primary" onclick="saveItem()">Save</button>
    </div>
    <div style="text-align:center"><button class="danger hidden" id="f-del" onclick="deleteItem()">Delete from the plan</button></div>
    <div class="err" id="sheet-err"></div>
  </div>
</div>

<div id="esheet" onclick="if(event.target===this) closeExpense()" style="position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;z-index:20">
  <div class="panel" style="background:var(--card);width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto">
    <h3 id="e-title">Add an expense</h3>
    <div class="row">
      <div>
        <label for="e-amount">Amount</label>
        <div style="display:flex;gap:8px">
          <input id="e-amount" type="text" inputmode="decimal" placeholder="42.50" autocomplete="off" style="flex:1">
          <select id="e-cur" style="width:88px">
            <option value="EUR">EUR</option>
            <option value="USD">USD</option>
          </select>
        </div>
      </div>
      <div>
        <label for="e-date">Day</label>
        <select id="e-date"></select>
      </div>
    </div>
    <label for="e-what">What for</label>
    <input id="e-what" type="text" placeholder="Dinner at Botin" autocomplete="off">
    <label for="e-payer">Who paid</label>
    <select id="e-payer"></select>
    <label>Split between</label>
    <div class="chips" id="e-with" style="margin-top:4px"></div>
    <div class="actions">
      <button class="ghost" onclick="closeExpense()">Cancel</button>
      <button class="primary" onclick="saveExpense()">Save</button>
    </div>
    <div style="text-align:center"><button class="danger hidden" id="e-del" onclick="deleteExpense()">Delete this expense</button></div>
    <div class="err" id="e-err"></div>
  </div>
</div>

<div id="gate">
  <h2>Spain</h2>
  <p>Ask Shine for the link and it will open on its own.<br>Or type the trip PIN.</p>
  <input id="pin" type="tel" inputmode="numeric" autocomplete="off" placeholder="••••">
  <button onclick="submitPin()">Open</button>
  <div class="err" id="gate-err"></div>
</div>

<script>
const API = '/api/get-booking';
const TRIP = 'spain';
const CACHE = 'spainPlanCache';
let TOKEN = localStorage.getItem('tripToken') || '';
let NAME  = localStorage.getItem('tripName') || '';
let days = [], items = [], editing = null, editingDay = null;
let people = [], expenses = [], editingExpense = null, splitWith = new Set();
let rate = 1.22;   // USD per EUR, agreed once for the whole trip
let cameFromPlan = false;
let hasJumped = false;

function jumpToToday() {
  if (hasJumped || tab !== 'plan') return;
  const day = dayToOpenOn(days, todayISO());
  if (!day) { hasJumped = true; return; }
  const card = document.querySelector('[data-day="' + day.id + '"]');
  if (!card) return;
  hasJumped = true;
  if (card.scrollIntoView) card.scrollIntoView({ block: 'start' });
}
let tab = 'plan', moneyReady = true;

// ── Server ──────────────────────────────────────────────────────────────────
async function api(action, extra) {
  return fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ action }, extra || {})),
  });
}

// Everything goes through the server proxy. The browser never holds a Supabase
// key, and the trip token is scoped server-side to these two tables only.
async function db(method, path, bodyObj, prefer) {
  const r = await api('db', { token: TOKEN, method, path, body: bodyObj, prefer });
  if (r.status === 401) { logout('That PIN no longer works. Enter it again.'); throw new Error('401'); }
  if (!r.ok) throw new Error(r.status + ' ' + await r.text());
  const t = await r.text();
  try { return JSON.parse(t); } catch (e) { return t; }
}

function logout(msg) {
  TOKEN = ''; localStorage.removeItem('tripToken');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('gate').classList.remove('hidden');
  if (msg) document.getElementById('gate-err').textContent = msg;
}

async function submitPin(pinOverride) {
  const pin = pinOverride !== undefined ? pinOverride : document.getElementById('pin').value.trim();
  const err = document.getElementById('gate-err');
  err.textContent = '';
  let r;
  try { r = await api('trip_login', { pin }); }
  catch (e) { err.textContent = 'No connection.'; return false; }
  if (!r.ok) { if (pinOverride === undefined) err.textContent = 'Wrong PIN.'; return false; }
  TOKEN = (await r.json()).token;
  localStorage.setItem('tripToken', TOKEN);
  boot();
  return true;
}

// The link carries the PIN, so nobody has to be told a number or type one.
//
// In the hash rather than the query string: a hash is never sent to the server,
// so it stays out of request logs and out of anything a proxy keeps. It is
// wiped from the address bar the moment it is used, so a screenshot of the page
// does not hand the trip to whoever sees it.
//
// The gate stays for the bare URL. This lives on Shine's business domain, and a
// page anyone can find by guessing a filename is a page with eight people's
// flight numbers on it.
async function tryLinkKey() {
  // Letters allowed, not just digits. TRIP_PIN is whatever was typed into
  // Vercel, and a link that silently fails to open because the value happened
  // to contain a letter is a bug nobody would think to look for.
  const m = (location.hash || '').match(/^#([A-Za-z0-9_-]{3,32})$/);
  if (!m) return false;
  const ok = await submitPin(m[1]);
  history.replaceState(null, '', location.pathname);
  if (!ok) document.getElementById('gate-err').textContent = 'That link is out of date. Ask Shine for a new one.';
  return ok;
}
document.getElementById('pin').addEventListener('keydown', e => { if (e.key === 'Enter') submitPin(); });

// ── Who is editing ──────────────────────────────────────────────────────────
// Asked once and kept locally. Eight people editing one plan is unreadable
// without knowing who put a thing there, and a name is cheaper than accounts.
function askName() {
  const n = prompt('Your name, so the others know who added what', NAME || '');
  if (n === null) return;
  NAME = n.trim().slice(0, 24);
  localStorage.setItem('tripName', NAME);
  document.getElementById('me').textContent = NAME || '—';
}

// ── Loading ─────────────────────────────────────────────────────────────────
function setStatus(t) { document.getElementById('status').textContent = t; }

function cacheWrite() {
  try { localStorage.setItem(CACHE, JSON.stringify({ at: Date.now(), days, items, people, expenses, rate })); } catch (e) {}
}

// Renders whatever was last seen before going near the network, so the plan is
// readable on a bad connection abroad instead of showing an empty page.
function cacheRead() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE) || 'null');
    if (!c || !Array.isArray(c.days)) return false;
    days = c.days; items = c.items || [];
    people = c.people || []; expenses = c.expenses || [];
    if (c.rate) rate = c.rate;
    render();
    showStale(c.at);
    return true;
  } catch (e) { return false; }
}

function showStale(at) {
  const el = document.getElementById('stale');
  if (!at) { el.classList.add('hidden'); return; }
  const mins = Math.round((Date.now() - at) / 60000);
  if (mins < 2) { el.classList.add('hidden'); return; }
  el.textContent = 'Showing the plan as of ' + (mins < 60 ? mins + ' minutes' : Math.round(mins / 60) + ' hours') + ' ago. Not connected.';
  el.classList.remove('hidden');
}

async function load(quiet) {
  if (!quiet) setStatus('Loading…');
  try {
    // The plan and the money load together but must not fail together. Before
    // the money tables exist, asking for them 404s, and inside a Promise.all
    // that would take the whole page down with it: no plan, no flights, no
    // hotels, on a page eight people are relying on.
    const soft = (path) => db('GET', path).catch(() => null);
    const [d, i, p, e, cfg] = await Promise.all([
      db('GET', `trip_days?trip=eq.${TRIP}&order=sort_index.asc`),
      db('GET', `trip_items?trip=eq.${TRIP}&order=at_time.asc,sort_index.asc`),
      soft(`trip_people?trip=eq.${TRIP}&order=sort_index.asc`),
      soft(`trip_expenses?trip=eq.${TRIP}&order=created_at.desc`),
      soft(`trip_config?trip=eq.${TRIP}`),
    ]);
    days = d || []; items = i || [];
    moneyReady = Array.isArray(p) && Array.isArray(e);
    people = p || []; expenses = e || [];
    if (cfg && cfg[0] && cfg[0].usd_per_eur) rate = Number(cfg[0].usd_per_eur) || rate;
    cacheWrite();
    document.getElementById('stale').classList.add('hidden');
    render();
    setStatus('Up to date');
  } catch (e) {
    if (String(e.message) === '401') return;
    setStatus('Offline');
    showStale(JSON.parse(localStorage.getItem(CACHE) || '{}').at);
  }
}

// ── Rendering ───────────────────────────────────────────────────────────────
// Built from local parts, not toISOString.
//
// toISOString converts to UTC first, and Spain is two hours ahead of it in
// October: at half past midnight on the 14th, UTC still says the 13th. That
// would file a late dinner against the wrong day and jump the page to the
// wrong card.
function todayISO() {
  const d = new Date();
  const pad = (x) => String(x).padStart(2, '0');
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}

// Which day the page should open on.
//
// Before the trip, the top: the whole thing is ahead of you. Once it has
// started, the day you are actually in, with the days behind you still there
// to scroll back to.
function dayToOpenOn(dayList, today) {
  return (dayList || []).find(d => d.date === today) || null;
}

function fmtTime(t) {
  const m = String(t || '').match(/^(\d{1,2}):(\d{2})$/);
  if (!m) return t || '';
  const h = Number(m[1]);
  const suffix = h < 12 ? 'AM' : 'PM';
  const twelve = h % 12 === 0 ? 12 : h % 12;
  return twelve + ':' + m[2] + ' ' + suffix;
}

function fmtDay(iso) {
  const dt = new Date(iso + 'T12:00:00');
  return dt.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
}

function render() {
  renderMoney();
  // Queued after the cards exist. Only ever once: the page refreshes itself
  // every twenty seconds, and yanking it back to today while somebody is
  // reading Thursday would be worse than not jumping at all.
  if (!hasJumped) setTimeout(jumpToToday, 0);
  const host = document.getElementById('days');
  host.textContent = '';

  if (days.length) {
    const a = fmtDay(days[0].date), b = fmtDay(days[days.length - 1].date);
    document.getElementById('range').textContent = a + ' – ' + b;
  }

  for (const day of days) {
    const mine = items.filter(x => x.day_id === day.id);
    const card = el('div', 'day');
    card.dataset.day = day.id;
    const isToday = day.date === todayISO();
    if (isToday) card.classList.add('today');

    const head = el('div', 'day-head');
    head.appendChild(el('span', 'd', fmtDay(day.date)));
    const city = el('button', 'city linkish', day.city || 'set city');
    city.style.fontSize = '14px';
    city.onclick = () => editCity(day);
    head.appendChild(city);
    if (isToday) head.appendChild(el('span', 'now', 'today'));
    head.appendChild(el('span', 'n', mine.length ? mine.length + (mine.length === 1 ? ' thing' : ' things') : ''));
    card.appendChild(head);

    if (!mine.length) card.appendChild(el('div', 'empty', 'Nothing planned yet.'));

    for (const it of mine) card.appendChild(itemRow(it));

    const add = el('button', 'add', '+  Add something');
    add.onclick = () => openSheet(day, null);
    card.appendChild(add);

    host.appendChild(card);
  }
}

// Built as DOM nodes, never as an HTML string. Everything here was typed by
// somebody else on the trip, and string templates are how that becomes a
// script tag.
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function itemRow(it) {
  const row = el('div', 'item' + (it.booked ? ' booked' : ''));
  row.appendChild(el('div', 't', fmtTime(it.at_time)));

  const body = el('div', 'body');
  const title = el('div', 'title', (it.booked ? '✓ ' : '') + (it.title || 'Untitled'));
  body.appendChild(title);
  if (it.detail) body.appendChild(el('div', 'detail', it.detail));

  const foot = el('div', 'by');
  if (it.category && it.category !== 'plan') {
    foot.appendChild(el('span', 'tag', it.category + ' '));
  }
  if (it.author) foot.appendChild(el('span', null, 'added by ' + it.author + ' '));
  if (it.place) {
    const a = el('a', 'map', 'Map');
    // A plain Maps search URL, which opens the native app on an iPhone and on
    // an Android without either of them needing anything installed first.
    a.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(it.place);
    a.target = '_blank'; a.rel = 'noopener';
    foot.appendChild(a);
  }
  if (foot.childNodes.length) body.appendChild(foot);

  row.appendChild(body);

  // Adding what a thing cost should start from the thing, not from a blank form
  // on another tab that has to be filled in again from memory.
  const cost = el('button', 'cost', 'cost');
  cost.setAttribute('aria-label', 'Add what ' + (it.title || 'this') + ' cost');
  cost.onclick = () => openExpenseForItem(it);
  row.appendChild(cost);

  const edit = el('button', 'edit', '\u270E');
  edit.setAttribute('aria-label', 'Edit ' + (it.title || 'this'));
  edit.onclick = () => openSheet(null, it);
  row.appendChild(edit);
  return row;
}

// ── Editing ─────────────────────────────────────────────────────────────────
function openSheet(day, item) {
  editing = item; editingDay = day || days.find(d => d.id === (item && item.day_id));
  document.getElementById('sheet-title').textContent = item ? 'Edit' : 'Add to ' + (editingDay ? fmtDay(editingDay.date) : 'the plan');
  document.getElementById('f-time').value   = item ? (item.at_time || '') : '';
  document.getElementById('f-title').value  = item ? (item.title || '') : '';
  document.getElementById('f-place').value  = item ? (item.place || '') : '';
  document.getElementById('f-detail').value = item ? (item.detail || '') : '';
  document.getElementById('f-cat').value    = item ? (item.category || 'plan') : 'plan';
  document.getElementById('f-booked').checked = item ? !!item.booked : false;
  document.getElementById('f-del').classList.toggle('hidden', !item);
  document.getElementById('sheet-err').textContent = '';
  document.getElementById('sheet').classList.add('open');
}
function closeSheet() { document.getElementById('sheet').classList.remove('open'); editing = null; }

async function saveItem() {
  const err = document.getElementById('sheet-err');
  const title = document.getElementById('f-title').value.trim();
  if (!title) { err.textContent = 'Give it a name.'; return; }
  if (!NAME) askName();

  const payload = {
    at_time: document.getElementById('f-time').value.trim(),
    title,
    place: document.getElementById('f-place').value.trim(),
    detail: document.getElementById('f-detail').value.trim(),
    category: document.getElementById('f-cat').value,
    booked: document.getElementById('f-booked').checked,
    author: NAME || 'someone',
    updated_at: new Date().toISOString(),
  };

  setStatus('Saving…');
  try {
    if (editing) {
      await db('PATCH', `trip_items?id=eq.${editing.id}`, payload);
    } else {
      payload.trip = TRIP;
      payload.day_id = editingDay.id;
      await db('POST', 'trip_items', payload);
    }
    closeSheet();
    await load(true);
  } catch (e) {
    err.textContent = 'Could not save. Check your connection and try again.';
    setStatus('Not saved');
  }
}

async function deleteItem() {
  if (!editing) return;
  if (!confirm('Delete "' + (editing.title || 'this') + '" from the plan?\n\nEveryone loses it, and there is no undo.')) return;
  setStatus('Removing…');
  try {
    await db('DELETE', `trip_items?id=eq.${editing.id}`);
    closeSheet();
    await load(true);
  } catch (e) { setStatus('Not removed'); }
}

async function editCity(day) {
  const c = prompt('Which city on ' + fmtDay(day.date) + '?', day.city || '');
  if (c === null) return;
  setStatus('Saving…');
  try {
    await db('PATCH', `trip_days?id=eq.${day.id}`, { city: c.trim() });
    await load(true);
  } catch (e) { setStatus('Not saved'); }
}

// Moving the first day shifts the rest by the same number of days, so the
// items stay attached to the day they were planned for.
async function shiftDates() {
  if (!days.length) return;
  const first = prompt('First day of the trip, as YYYY-MM-DD', days[0].date);
  if (first === null) return;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(first.trim())) { alert('Use the form 2026-10-10.'); return; }
  const base = new Date(first.trim() + 'T12:00:00');
  if (isNaN(base)) { alert('That is not a date.'); return; }

  setStatus('Saving…');
  try {
    for (let i = 0; i < days.length; i++) {
      const d = new Date(base); d.setDate(base.getDate() + i);
      const iso = d.toISOString().slice(0, 10);
      if (iso !== days[i].date) await db('PATCH', `trip_days?id=eq.${days[i].id}`, { date: iso });
    }
    await load(true);
  } catch (e) { setStatus('Not saved'); }
}

// ── Boot ────────────────────────────────────────────────────────────────────
// ── Money ───────────────────────────────────────────────────────────────────

function showTab(which) {
  tab = which;
  document.getElementById('tab-plan').classList.toggle('on', which === 'plan');
  document.getElementById('tab-money').classList.toggle('on', which === 'money');
  document.getElementById('days').classList.toggle('hidden', which !== 'plan');
  document.getElementById('money').classList.toggle('hidden', which !== 'money');
}

const eur = (cents) => '€' + (cents / 100).toFixed(2);
const usd = (cents) => '$' + (cents * rate / 100).toFixed(2);
// A separator, not two spaces. HTML collapses whitespace, so the two figures ran
// together as one unreadable number.
const both = (cents) => eur(cents) + ' · ' + usd(cents);

// Everything nets in EUR. A settlement cannot be computed across two currencies
// without picking one, and euros are what most of this trip is spent in.
// Rounded to the cent on the way in, so the totals stay whole numbers of cents
// and the balances still land on exactly zero.
function toEurCents(amountCents, currency) {
  return currency === 'USD' ? Math.round(amountCents / rate) : amountCents;
}

// Splits an amount so the parts add back up to it, exactly.
//
// 100.00 three ways is 33.33, 33.33 and 33.34, not three of 33.33. The odd
// cents go to the first few, deterministically. Without this the balances never
// reach zero and somebody is left owing a fraction of a cent forever.
function shareOut(cents, ids) {
  const out = {};
  const n = ids.length;
  if (!n) return out;
  const base = Math.floor(cents / n);
  let extra = cents - base * n;
  for (const id of ids) {
    out[id] = base + (extra > 0 ? 1 : 0);
    if (extra > 0) extra--;
  }
  return out;
}

// Who owes whom, in as few payments as possible.
//
// Nets everyone off first, then repeatedly settles the largest debt against the
// largest credit. That is at most one payment fewer than there are people,
// which matters when the alternative is eight people making twenty transfers.
function settleUp(peopleList, expenseList) {
  const net = {};
  for (const p of peopleList) net[p.id] = 0;
  let total = 0;

  for (const e of expenseList) {
    const amount = toEurCents(e.amount_cents || 0, e.currency);
    const withIds = (e.shared_with || []).filter(id => id in net);
    if (!amount || !withIds.length) continue;
    total += amount;
    if (e.paid_by in net) net[e.paid_by] += amount;
    const parts = shareOut(amount, withIds);
    for (const id of withIds) net[id] -= parts[id];
  }

  const owe = peopleList.filter(p => net[p.id] < 0).map(p => ({ id: p.id, amount: -net[p.id] }));
  const due = peopleList.filter(p => net[p.id] > 0).map(p => ({ id: p.id, amount: net[p.id] }));
  owe.sort((a, b) => b.amount - a.amount);
  due.sort((a, b) => b.amount - a.amount);

  const transfers = [];
  let i = 0, j = 0;
  while (i < owe.length && j < due.length) {
    const pay = Math.min(owe[i].amount, due[j].amount);
    if (pay > 0) transfers.push({ from: owe[i].id, to: due[j].id, amount: pay });
    owe[i].amount -= pay;
    due[j].amount -= pay;
    if (owe[i].amount === 0) i++;
    if (due[j].amount === 0) j++;
  }
  return { net, transfers, total };
}

const personName = (id) => (people.find(p => p.id === id) || {}).name || 'someone';

// Whether somebody is on the trip on a given day. Dev and Nithya only join for
// the Barcelona end, and defaulting a Madrid dinner to "everybody" would quietly
// bill them for it.
function presentOn(p, date) {
  if (!date) return true;
  if (p.from_date && date < p.from_date) return false;
  if (p.to_date && date > p.to_date) return false;
  return true;
}

function daysLabel(p) {
  if (!p.from_date && !p.to_date) return '';
  const f = p.from_date ? fmtDay(p.from_date) : 'the start';
  const t = p.to_date ? fmtDay(p.to_date) : 'the end';
  return f + ' to ' + t;
}

// "11 to 15" rather than "2026-10-11 to 2026-10-15".
//
// Nobody types a full ISO date on a phone, and the trip is six days long, so a
// day of the month is unambiguous. Full dates still work for anyone who prefers
// them.
function resolveTripDate(token) {
  const t = String(token).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(t)) return t;
  const n = parseInt(t, 10);
  if (!(n >= 1 && n <= 31)) return null;
  const hit = days.find(d => Number(d.date.slice(8, 10)) === n);
  return hit ? hit.date : null;
}

function parseStay(text) {
  const t = String(text).trim();
  if (!t) return null;
  const parts = t.split(/\s*(?:to|until|through|–|—|-)\s*/).filter(Boolean);
  // A bare ISO date splits on its own hyphens, so put it back together.
  if (parts.length === 6) return [null, parts.slice(0, 3).join('-'), parts.slice(3).join('-')];
  if (parts.length !== 2) return null;
  const from = resolveTripDate(parts[0]), to = resolveTripDate(parts[1]);
  return from && to ? [null, from, to] : null;
}

function shortRange(from, to) {
  return Number(from.slice(8, 10)) + ' to ' + Number(to.slice(8, 10));
}

async function editRate() {
  const r = prompt('How many dollars to the euro? Everyone gets converted by the same number, which is what makes it fair.', String(rate));
  if (r === null) return;
  const v = Number(String(r).replace(',', '.'));
  if (!(v > 0)) { alert('That is not a rate.'); return; }
  setStatus('Saving\u2026');
  try {
    await db('PATCH', `trip_config?trip=eq.${TRIP}`, { usd_per_eur: v, updated_at: new Date().toISOString() });
    await load(true);
  } catch (e) { setStatus('Not saved'); }
}

function renderMoney() {
  const { transfers, total } = settleUp(people, expenses);

  document.getElementById('m-total').textContent = people.length ? both(total) : '-';
  document.getElementById('m-rate').textContent =
    'Converting at \u20AC1 = $' + Number(rate).toFixed(2) + '. Tap to change.';
  document.getElementById('m-each').textContent =
    people.length ? eur(Math.round(total / people.length)) : '-';

  const chips = document.getElementById('m-people');
  chips.textContent = '';
  for (const p of people) {
    const label = daysLabel(p);
    const c = el('button', 'chip', p.name + (label ? '  \u00B7 ' + label : ''));
    c.onclick = () => renamePerson(p);
    chips.appendChild(c);
  }
  const add = el('button', 'chip add', people.length ? '+ add' : '+ add everyone splitting');
  add.onclick = addPerson;
  chips.appendChild(add);

  const settle = document.getElementById('m-settle');
  settle.textContent = '';
  document.getElementById('m-count').textContent =
    transfers.length ? transfers.length + (transfers.length === 1 ? ' payment' : ' payments') : '';
  if (!moneyReady) {
    settle.appendChild(el('div', 'empty',
      'Expenses are not switched on yet. The two money tables still need creating in the database.'));
  } else if (!people.length) {
    settle.appendChild(el('div', 'empty', 'Add everyone splitting first. Couples work well as one name.'));
  } else if (!transfers.length) {
    settle.appendChild(el('div', 'settled', expenses.length ? 'All square.' : 'Nothing spent yet.'));
  } else {
    for (const t of transfers) {
      const row = el('div', 'owe');
      row.appendChild(el('span', 'who', personName(t.from)));
      row.appendChild(el('span', null, 'pays'));
      row.appendChild(el('span', 'who', personName(t.to)));
      row.appendChild(el('span', 'amt', both(t.amount)));
      settle.appendChild(row);
    }
  }

  const list = document.getElementById('m-list');
  list.textContent = '';
  if (!expenses.length) list.appendChild(el('div', 'empty', 'Nothing yet.'));
  for (const e of expenses) {
    const row = el('div', 'exp');
    const body = el('div', 'body');
    body.appendChild(el('div', 'title', e.description || 'Expense'));
    const n = (e.shared_with || []).length;
    body.appendChild(el('div', 'sub',
      personName(e.paid_by) + ' paid' + (n ? ', split ' + n + (n === 1 ? ' way' : ' ways') : '') +
      (e.spent_on ? ' · ' + fmtDay(e.spent_on) : '')));
    row.appendChild(body);
    const shown = e.currency === 'USD'
      ? '$' + ((e.amount_cents || 0) / 100).toFixed(2)
      : eur(e.amount_cents || 0);
    const amt = el('div', 'amt', shown);
    if (e.currency === 'USD') amt.title = 'about ' + eur(toEurCents(e.amount_cents, 'USD'));
    row.appendChild(amt);
    const edit = el('button', 'edit', '✎');
    edit.setAttribute('aria-label', 'Edit ' + (e.description || 'this expense'));
    edit.onclick = () => openExpense(e);
    row.appendChild(edit);
    list.appendChild(row);
  }
}

async function addPerson() {
  const n = prompt('Name. A couple counts as one, so "Shine and Kavitha" is fine.', '');
  if (n === null || !n.trim()) return;
  setStatus('Saving…');
  try {
    await db('POST', 'trip_people', { trip: TRIP, name: n.trim().slice(0, 40), sort_index: people.length });
    await load(true);
  } catch (e) { setStatus('Not saved'); }
}

async function renamePerson(p) {
  const n = prompt('Rename, or clear the box to remove them.', p.name);
  if (n === null) return;
  try {
    if (!n.trim()) {
      // Their expenses go with them. A settlement that references somebody who
      // is no longer in the list cannot balance.
      if (!confirm('Remove ' + p.name + ', and every expense they paid for?')) return;
      setStatus('Saving…');
      await db('DELETE', `trip_expenses?paid_by=eq.${p.id}`);
      await db('DELETE', `trip_people?id=eq.${p.id}`);
    } else {
      // Dates only asked for after the name, because most people are there for
      // the whole trip and should not have to answer a second question.
      const when = prompt(
        'Which days are they here for?\n\nJust the dates of the month is enough, like  11 to 15.\nLeave it blank if they are there for the whole trip.',
        p.from_date ? shortRange(p.from_date, p.to_date) : '');
      if (when === null) return;
      const m = parseStay(when);
      setStatus('Saving…');
      await db('PATCH', `trip_people?id=eq.${p.id}`, {
        name: n.trim().slice(0, 40),
        from_date: m ? m[1] : null,
        to_date: m ? m[2] : null,
      });
    }
    await load(true);
  } catch (e) { setStatus('Not saved'); }
}

// Opens the expense sheet already knowing what and when, from a plan entry.
//
// The alternative was reading the dinner off one tab and typing it into a form
// on another, which is how an amount ends up filed against the wrong day.
function openExpenseForItem(it) {
  if (!moneyReady) { alert('Expenses are not switched on yet.'); return; }
  if (!people.length) { showTab('money'); addPerson(); return; }
  const day = days.find(d => d.id === it.day_id);
  openExpense(null, { description: it.title || '', spent_on: day && day.date, fromPlan: true });
}

function openExpense(e, prefill) {
  if (!people.length) { addPerson(); return; }
  editingExpense = e || null;
  cameFromPlan = !!(prefill && prefill.fromPlan);
  document.getElementById('e-title').textContent = e ? 'Edit expense' : 'Add an expense';
  document.getElementById('e-amount').value = e ? (e.amount_cents / 100).toFixed(2) : '';
  document.getElementById('e-cur').value = e ? (e.currency || 'EUR') : 'EUR';
  document.getElementById('e-what').value = e ? (e.description || '') : ((prefill && prefill.description) || '');
  document.getElementById('e-err').textContent = '';
  document.getElementById('e-del').classList.toggle('hidden', !e);

  const payer = document.getElementById('e-payer');
  payer.textContent = '';
  for (const p of people) {
    const o = el('option', null, p.name);
    o.value = p.id;
    payer.appendChild(o);
  }
  payer.value = e ? e.paid_by : (people[0] && people[0].id);

  const dsel = document.getElementById('e-date');
  dsel.textContent = '';
  for (const d of days) {
    const o = el('option', null, fmtDay(d.date) + (d.city ? ' · ' + d.city : ''));
    o.value = d.date;
    dsel.appendChild(o);
  }
  const today = todayISO();
  dsel.value = e ? e.spent_on
    : ((prefill && prefill.spent_on) || (days.find(d => d.date === today) || days[0] || {}).date);

  // Everybody, by default. Most things on a trip are split by everybody, and
  // deselecting two is faster than selecting six.
  const when = dsel.value;
  splitWith = new Set(e ? (e.shared_with || [])
                        : people.filter(p => presentOn(p, when)).map(p => p.id));
  renderSplitChips();
  // Changing the day changes who was even there.
  dsel.onchange = () => {
    if (editingExpense) return;
    splitWith = new Set(people.filter(p => presentOn(p, dsel.value)).map(p => p.id));
    renderSplitChips();
  };
  document.getElementById('esheet').style.display = 'flex';
}

function renderSplitChips() {
  const host = document.getElementById('e-with');
  host.textContent = '';
  const when = document.getElementById('e-date').value;
  for (const p of people) {
    const away = !presentOn(p, when);
    const c = el('button', 'chip' + (splitWith.has(p.id) ? ' on' : ''),
                 p.name + (away ? '  (not here)' : ''));
    if (away && !splitWith.has(p.id)) c.style.opacity = '0.45';
    c.onclick = () => {
      if (splitWith.has(p.id)) splitWith.delete(p.id); else splitWith.add(p.id);
      renderSplitChips();
    };
    host.appendChild(c);
  }
}

function closeExpense() {
  document.getElementById('esheet').style.display = 'none';
  editingExpense = null;
}

// Reads "42.50" as 4250, off the text rather than by multiplying a float.
// 42.50 * 100 is 4249.999... in binary, and rounding that the wrong way often
// enough over a week of dinners is how a settlement ends up a few cents out.
function toCents(text) {
  const m = String(text).trim().replace(',', '.').match(/^(\d+)(?:\.(\d{1,2}))?$/);
  if (!m) return null;
  return parseInt(m[1], 10) * 100 + parseInt((m[2] || '0').padEnd(2, '0'), 10);
}

async function saveExpense() {
  const err = document.getElementById('e-err');
  const cents = toCents(document.getElementById('e-amount').value);
  if (cents === null || cents <= 0) { err.textContent = 'Give it an amount, like 42.50.'; return; }
  const what = document.getElementById('e-what').value.trim();
  if (!what) { err.textContent = 'Say what it was for.'; return; }
  if (!splitWith.size) { err.textContent = 'Somebody has to be splitting it.'; return; }
  if (!NAME) askName();

  const payload = {
    description: what,
    amount_cents: cents,
    currency: document.getElementById('e-cur').value === 'USD' ? 'USD' : 'EUR',
    paid_by: document.getElementById('e-payer').value,
    shared_with: Array.from(splitWith),
    spent_on: document.getElementById('e-date').value || null,
    author: NAME || 'someone',
    updated_at: new Date().toISOString(),
  };
  setStatus('Saving…');
  try {
    if (editingExpense) await db('PATCH', `trip_expenses?id=eq.${editingExpense.id}`, payload);
    else await db('POST', 'trip_expenses', Object.assign({ trip: TRIP }, payload));
    closeExpense();
    // Land on Money, so the thing just recorded is visible rather than
    // disappearing into a tab nobody switched to.
    if (cameFromPlan) { showTab('money'); cameFromPlan = false; }
    await load(true);
  } catch (e) {
    err.textContent = 'Could not save. Check your connection.';
    setStatus('Not saved');
  }
}

async function deleteExpense() {
  if (!editingExpense) return;
  if (!confirm('Delete "' + (editingExpense.description || 'this') + '"?\n\nEveryone loses it, and there is no undo.')) return;
  setStatus('Removing…');
  try {
    await db('DELETE', `trip_expenses?id=eq.${editingExpense.id}`);
    closeExpense();
    await load(true);
  } catch (e) { setStatus('Not removed'); }
}

function boot() {
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('me').textContent = NAME || '—';
  if (!NAME) setTimeout(askName, 300);
  cacheRead();
  load();
}

// Other people are editing the same page, so it refreshes on a slow timer and
// whenever the phone comes back to it. Twenty seconds is often enough that a
// change appears while you are still looking, and rare enough to be free.
setInterval(() => { if (TOKEN && document.visibilityState === 'visible') load(true); }, 20000);
document.addEventListener('visibilitychange', () => { if (TOKEN && document.visibilityState === 'visible') load(true); });

if (TOKEN) { boot(); } else { tryLinkKey(); }
</script>
