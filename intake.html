<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Questionnaire — Shine, The Mentalist</title>
    <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0
    }

    body {
        font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f0ebfa;
        color: #202124;
        font-size: 16px;
        min-height: 100vh;
        padding: 24px 20px 48px
    }

    .page {
        max-width: 640px;
        margin: 0 auto
    }

    .header {
        text-align: center;
        padding: 20px 0 22px
    }

    .header .logo {
        width: 64px;
        height: 64px;
        margin-bottom: 12px;
        filter: drop-shadow(0 2px 6px rgba(103, 80, 164, 0.3))
    }

    .header h1 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.01em
    }

    .header p {
        font-size: 13.5px;
        color: #5f6368;
        margin-top: 8px;
        line-height: 1.6;
        padding: 0 8px
    }

    /* Section = a plain, unboxed group heading; each field below renders as its own
       Google-Forms-style card (see .field), not nested inside a shared box. */
    .section {
        margin-bottom: 32px
    }

    .section-title {
        font-size: 20px;
        font-weight: 700;
        color: #202124;
        margin-bottom: 18px;
        padding-bottom: 12px;
        border-bottom: 3px solid #6750a4;
        display: flex;
        align-items: center;
        gap: 8px
    }

    .field {
        background: #fff;
        border-radius: 12px;
        padding: 24px 26px;
        margin-bottom: 18px;
        box-shadow: 0 1px 2px rgba(60, 64, 67, 0.08), 0 1px 6px rgba(60, 64, 67, 0.06);
        border-left: 4px solid transparent;
        transition: border-color 0.15s
    }

    .field:focus-within {
        border-left-color: #6750a4
    }

    .field:last-child {
        margin-bottom: 0
    }

    /* Direct-child combinator, not a plain descendant selector: a bare ".field label"
       also matched the radio-option <label> nested inside .radio-group (a grandchild of
       .field), and its higher specificity (class+tag beats .radio-option's class alone)
       silently forced display:block onto every radio row, breaking the flex layout that
       sits the circle and its text side by side. */
    .field > label {
        display: block;
        font-size: 16px;
        color: #202124;
        margin-bottom: 16px;
        font-weight: 500;
        line-height: 1.4
    }

    .field .hint {
        font-size: 12.5px;
        color: #80868b;
        font-weight: 400;
        display: block;
        margin-top: 4px
    }

    .field input[type="text"], .field input[type="email"], .field input[type="tel"], .field select {
        width: 100%;
        padding: 8px 2px 10px;
        font-size: 15px;
        border: none;
        border-bottom: 1.5px solid #dadce0;
        border-radius: 0;
        background: transparent;
        color: #202124;
        font-family: inherit;
        -webkit-appearance: none;
        transition: border-color 0.15s
    }

    .field input[type="text"]:focus, .field input[type="email"]:focus, .field input[type="tel"]:focus, .field select:focus {
        outline: none;
        border-bottom-color: #6750a4
    }

    /* Native date/time pickers look broken with just an underline (their own internal
       chrome has no bottom edge to sit on), so they get a real bordered pill instead,
       matching how Google Forms renders its own date/time widgets. */
    .field input[type="date"], .field input[type="time"] {
        width: 100%;
        max-width: 220px;
        padding: 11px 14px;
        font-size: 15px;
        border: 1.5px solid #dadce0;
        border-radius: 24px;
        background: #fff;
        color: #202124;
        font-family: inherit;
        transition: border-color 0.15s
    }

    .field input[type="date"]:focus, .field input[type="time"]:focus {
        outline: none;
        border-color: #6750a4
    }

    .field textarea {
        width: 100%;
        resize: vertical;
        min-height: 80px;
        line-height: 1.5;
        font-size: 15px;
        border: 1.5px solid #dadce0;
        border-radius: 8px;
        padding: 12px 14px;
        background: #fff;
        color: #202124;
        font-family: inherit;
        transition: border-color 0.15s
    }

    .field textarea:focus {
        outline: none;
        border-color: #6750a4
    }

    .two-col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px
    }

    .radio-group {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-top: 6px
    }

    .radio-option {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 12px 6px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: transparent;
        transition: background 0.12s
    }

    .radio-option:hover {
        background: #f7f5fb
    }

    .radio-option input[type="radio"] {
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        margin: 0;
        width: 22px;
        height: 22px;
        min-width: 22px;
        border-radius: 50%;
        border: 2px solid #5f6368;
        background: #fff;
        flex-shrink: 0;
        display: grid;
        place-content: center;
        transition: border-color 0.15s;
        cursor: pointer
    }

    .radio-option input[type="radio"]::before {
        content: '';
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #6750a4;
        transform: scale(0);
        transition: transform 0.12s
    }

    .radio-option input[type="radio"]:checked::before {
        transform: scale(1)
    }

    .radio-option input[type="radio"]:checked {
        border-color: #6750a4
    }

    .radio-option span.label-text {
        font-size: 15px;
        font-weight: 400;
        color: #3c4043;
        line-height: 1.45
    }

    .radio-option.selected span.label-text {
        color: #202124;
        font-weight: 500
    }

    .submit-btn {
        width: 100%;
        padding: 16px;
        background: #6750a4;
        color: #fff;
        border: none;
        border-radius: 24px;
        font-size: 16.5px;
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
        margin-top: 6px;
        box-shadow: 0 4px 14px rgba(103, 80, 164, 0.35);
        transition: transform 0.1s, box-shadow 0.1s
    }

    .submit-btn:active {
        transform: scale(0.98)
    }

    .submit-btn:disabled {
        background: #d0c7e8;
        box-shadow: none;
        cursor: not-allowed
    }

    .save-draft-btn {
        width: 100%;
        padding: 14px;
        background: transparent;
        color: #6750a4;
        border: 1.5px solid #d8cdf0;
        border-radius: 24px;
        font-size: 14.5px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        margin-top: 10px;
        transition: background 0.15s
    }

    .save-draft-btn:active {
        background: #f3edfc
    }

    .save-draft-btn:disabled {
        color: #aeaeb2;
        border-color: #e5e5ea;
        cursor: not-allowed
    }

    .text-photo-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-top: 10px;
        padding: 12px;
        background: #f3edfc;
        color: #6750a4;
        border: 1.5px solid #d8cdf0;
        border-radius: 11px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: background 0.15s
    }

    .text-photo-btn:active {
        background: #e9defa
    }

    .loading {
        text-align: center;
        padding: 60px 20px;
        color: #6e6e73
    }

    .success-screen {
        display: none;
        text-align: center;
        padding: 70px 16px
    }

    .success-screen.show {
        display: block
    }

    .success-screen .icon {
        font-size: 52px;
        margin-bottom: 18px;
        display: inline-block;
        filter: drop-shadow(0 2px 8px rgba(52, 199, 89, 0.3))
    }

    .success-screen h2 {
        font-size: 21px;
        font-weight: 700;
        margin-bottom: 10px
    }

    .success-screen p {
        font-size: 14.5px;
        color: #6e6e73;
        line-height: 1.7;
        padding: 0 12px
    }
    </style>
</head>
<body>
    <div class="page" id="main-page">
        <div class="header">
            <img class="logo" src="/icons/logo.png" alt="Shine, The Mentalist">
            <h1 id="greeting-title">Event Details</h1>
            <p id="greeting-text">Loading your questionnaire...</p>
        </div>
        <div id="form-content"></div>
    </div>

    <div class="page" id="success-page" style="display:none">
        <div class="success-screen show">
            <div class="icon">✦</div>
            <h2>All set!</h2>
            <p>Thanks for filling that out — this helps me make your show personal and unforgettable. See you at the event!</p>
        </div>
    </div>

    <script>
    function getBookingId() {
        return new URLSearchParams(window.location.search).get('bid') || '';
    }

    let bookingData = null;

    function loadBooking() {
        fetch('/api/get-booking?mode=full&bid=' + getBookingId())
        .then(r => r.json())
        .then(data => {
            if (data.error)
                throw new Error(data.error);
            bookingData = data;
            renderForm(data);
        })
        .catch(e => {
            document.getElementById('form-content').innerHTML = '<div class="loading">Could not load this form. Please contact Shine directly.</div>';
        });
    }

    function escapeAttr(str) {
        return String(str || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    }

    function radioGroup(name, options) {
        return options.map((opt, i) =>
        '<label class="radio-option" for="' + name + '-' + i + '">' +
        '<input type="radio" name="' + name + '" value="' + opt + '" id="' + name + '-' + i + '" onchange="onRadioChange(this)">' +
        '<span class="label-text">' + opt + '</span>' +
        '</label>'
        ).join('');
    }

    function onRadioChange(input) {
        document.querySelectorAll('input[name="' + input.name + '"]').forEach(function(r) {
            r.closest('.radio-option').classList.remove('selected');
        });
        input.closest('.radio-option').classList.add('selected');
    }

    // Generates a consistent photo-link field across every event type: a label, a hint with
    // the inline text-link as a fallback, the URL input itself, and a prominent standalone
    // button to open Messages directly — since most people send photos by text, not a link.
    function photoField(fieldId, personLabel, opts) {
        opts = opts || {};
        const labelText = opts.labelText || ('Link to a photo of ' + personLabel);
        const hintText = opts.hintText || '(Google Drive, Dropbox, or any shareable link, or text it to me at <a href="sms:+16128657681" style="color:#6750a4;text-decoration:none">+1 (612) 865-7681</a>)';
        return `
      <div class="field">
        <label>${labelText} <span class="hint">${hintText}</span></label>
        <input type="text" id="${fieldId}" placeholder="https://...">
        <a href="sms:+16128657681" class="text-photo-btn">📱 Text me the photo instead</a>
      </div>
    `;
    }

    function renderForm(d) {
        const firstName = (d.clientName || '').split(' ')[0];
        document.getElementById('greeting-title').textContent = 'Hi ' + firstName + ',';
        document.getElementById('greeting-text').textContent = "Thank you for booking my show! This short questionnaire helps me personalize the experience and ensure everything runs smoothly for your event. — Shine, The Mentalist";

        const eventType = (d.eventType || '').toLowerCase();
        // School/education bookings skip indoor/outdoor (near-always indoors on campus) and
        // get a different Section 2/3 question set below, tailored to a staff/faculty event.
        const isSchool = eventType.includes('school') || eventType.includes('education');
        // Senior living / retirement community shows: residents plus their families, so there is
        // usually no single guest of honour, and the questions that matter instead are mobility,
        // hearing/vision and how residents can take part. Also always indoors, like school events.
        const isSenior = eventType.includes('senior') || eventType.includes('retirement')
            || eventType.includes('assisted living') || eventType.includes('nursing')
            || eventType.includes('memory care');
        let html = '';

        // Section 1: Event basics
        html += '<div class="section"><div class="section-title">📍 Event basics</div>';
        html += `
    <div class="field">
      <label>Event date</label>
      <input type="date" id="q_event_date" value="${

        d.eventDate || ''}">
    </div>
    <div class="field">
      <label>Start time</label>
      <input type="time" id="q_start_time">
    </div>
    <div class="field">
      <label>Guest count</label>
      <input type="text" id="q_guests" placeholder="e.g. 25">
    </div>
    <div class="field">
      <label>Event location / address</label>
      <input type="text" id="q_address" placeholder="Full address">
    </div>
  ` + ((isSchool || isSenior) ? '' : `
    <div class="field">
      <label>Indoor or outdoor event?</label>
      <div class="radio-group">${
















        radioGroup('q_indoor_outdoor', ['Indoor', 'Outdoor', 'Both'])}</div>
    </div>
  `);
        html += '</div>';

        // Section 2: Event-specific questions
        html += '<div class="section"><div class="section-title">🎉 About your event</div>';

        if (eventType.includes('bachelorette')) {
            html += `
      <div class="field"><label>Bride's full name</label><input type="text" id="q_honoree"></div>
      <div class="field"><label>Groom's full name</label><input type="text" id="q_groom_name"></div>
      <div class="field"><label>Bride's date of birth</label><input type="date" id="q_honoree_dob"></div>
      <div class="field"><label>Groom's date of birth</label><input type="date" id="q_groom_dob"></div>
      <div class="field"><label>Wedding day</label><input type="date" id="q_wedding_date"></div>
      <div class="field"><label>Any VIPs or special people attending?</label><input type="text" id="q_vips"></div>
      <div class="field"><label>Anyone who should NOT be involved?</label><input type="text" id="q_exclude"></div>
      <div class="field"><label>What kind of vibe are you looking for?</label>
        <div class="radio-group">${




            radioGroup('q_vibe', ['Clean elegant & classy', 'Light adult humor', 'Slightly edgy / flirty', 'Bold & edgy'])}</div>
      </div>
      <div class="field"><label>Any other entertainment before or after my show?</label><textarea id="q_other_entertainment"></textarea></div>
      <div class="field"><label>Tell me about the bride <span class="hint">(personality, hobbies, a funny or embarrassing story, anything most people don't know — I'll use this to personalize the show and a few custom touches)</span></label><textarea id="q_trivia_bride"></textarea></div>
      <div class="field"><label>Tell me about the groom <span class="hint">(personality, hobbies, a funny or embarrassing story, anything most people don't know — I'll use this to personalize the show and a few custom touches)</span></label><textarea id="q_trivia_groom"></textarea></div>
      ${photoField('q_photo_bride', 'the bride', { labelText: 'Please share a photo of the bride, with or without the groom', hintText: 'You can give the link here for the photo or share with me via text. (Google Drive, Dropbox, or any shareable link, or text it to me at <a href="sms:+16128657681" style="color:#6750a4;text-decoration:none">+1 (612) 865-7681</a>)' })}
      <div class="field"><label>Anything else I should know? <span class="hint">(how they met, the proposal story, etc.)</span></label><textarea id="q_anything_else"></textarea></div>
    `





            ;
        } else if (eventType.includes('bachelor')) {
            html += `
      <div class="field"><label>Groom's full name</label><input type="text" id="q_honoree"></div>
      <div class="field"><label>Groom's date of birth</label><input type="date" id="q_honoree_dob"></div>
      <div class="field"><label>Any VIPs or special people attending?</label><input type="text" id="q_vips"></div>
      <div class="field"><label>Anyone who should NOT be involved?</label><input type="text" id="q_exclude"></div>
      <div class="field"><label>What kind of vibe are you looking for?</label>
        <div class="radio-group">${




            radioGroup('q_vibe', ['Clean elegant & classy', 'Light adult humor', 'Slightly edgy / flirty', 'Bold & edgy'])}</div>
      </div>
      <div class="field"><label>Any other entertainment before or after my show?</label><textarea id="q_other_entertainment"></textarea></div>
      <div class="field"><label>Tell me about the groom <span class="hint">(personality, hobbies, a funny or embarrassing story, anything most people don't know — I'll use this to personalize the show and a few custom touches)</span></label><textarea id="q_trivia_groom"></textarea></div>
      ${photoField('q_photo_groom', 'the groom')}
      <div class="field"><label>Anything else I should know? <span class="hint">(how they met, the proposal story, etc.)</span></label><textarea id="q_anything_else"></textarea></div>
    `





            ;
        } else if (eventType.includes('birthday')) {
            html += `
      <div class="field"><label>Type of crowd</label>
        <div class="radio-group">${
            radioGroup('q_crowd', ['All adults', 'Include kids', 'Family crowd'])}</div>
      </div>
      <div class="field"><label>Full name of guest of honor</label><input type="text" id="q_honoree"></div>
      <div class="field"><label>Actual date of birth</label><input type="date" id="q_honoree_dob"></div>
      <div class="field"><label>Any VIPs or special people attending?</label><input type="text" id="q_vips"></div>
      <div class="field"><label>Anyone who should NOT be involved?</label><input type="text" id="q_exclude"></div>
      <div class="field"><label>What kind of vibe are you looking for?</label>
        <div class="radio-group">${





            radioGroup('q_vibe', ['Clean elegant & classy', 'Family friendly', 'Light adult humor', 'Slightly edgy / flirty', 'Bold & edgy'])}</div>
      </div>
      <div class="field"><label>Tell me about the birthday person <span class="hint">(personality, hobbies, a funny or embarrassing story, anything most people don't know — I'll use this to personalize the show and a few custom touches)</span></label><textarea id="q_trivia"></textarea></div>
      ${photoField('q_photo_honoree', 'the birthday person')}
    `



            ;
        } else if (eventType.includes('anniversary')) {
            html += `
      <div class="field"><label>Spouse 1's full name</label><input type="text" id="q_spouse1_name"></div>
      <div class="field"><label>Spouse 2's full name</label><input type="text" id="q_spouse2_name"></div>
      <div class="field"><label>Date of marriage</label><input type="date" id="q_marriage_date"></div>
      <div class="field"><label>Any VIPs or special people attending?</label><input type="text" id="q_vips"></div>
      <div class="field"><label>Anyone who should NOT be involved?</label><input type="text" id="q_exclude"></div>
      <div class="field"><label>What kind of vibe are you looking for?</label>
        <div class="radio-group">${







            radioGroup('q_vibe', ['Clean elegant & classy', 'Family friendly', 'Light adult humor', 'Slightly edgy / flirty', 'Bold & edgy'])}</div>
      </div>
      <div class="field"><label>Tell me about spouse 1 <span class="hint">(personality, hobbies, a funny or embarrassing story, anything most people don't know)</span></label><textarea id="q_trivia_spouse1"></textarea></div>
      ${photoField('q_photo_spouse1', 'spouse 1', { hintText: '(or text it to me at <a href="sms:+16128657681" style="color:#6750a4;text-decoration:none">+1 (612) 865-7681</a>)' })}
      <div class="field"><label>Tell me about spouse 2 <span class="hint">(personality, hobbies, a funny or embarrassing story, anything most people don't know)</span></label><textarea id="q_trivia_spouse2"></textarea></div>
      ${photoField('q_photo_spouse2', 'spouse 2', { hintText: '(or text it to me at <a href="sms:+16128657681" style="color:#6750a4;text-decoration:none">+1 (612) 865-7681</a>)' })}
      <div class="field"><label>Anything else I should know? <span class="hint">(how they met, favorite memories, etc.)</span></label><textarea id="q_anything_else"></textarea></div>
    `






            ;
        } else if (isSchool) {
            html += `
      <div class="field"><label>Grade levels or departments represented <span class="hint">(optional)</span></label><input type="text" id="q_grade_levels" placeholder="e.g. all staff, K-5 teachers, front office"></div>
      <div class="field"><label>How would you describe the year your team has had? <span class="hint">(optional — helps me strike the right tone)</span></label><textarea id="q_year_recap"></textarea></div>
      <div class="field"><label>What's the main goal for this event?</label>
        <div class="radio-group">${radioGroup('q_goal', ['Team building & morale', 'Celebrate wins & achievements', 'Fresh start for the new year', 'Just have fun'])}</div>
      </div>
      <div class="field"><label>Are administrators or district staff attending? Would you like them involved in the show?</label><input type="text" id="q_vips"></div>
      <div class="field"><label>Any staff achievements, milestones, or moments from this year you'd like recognized?</label><textarea id="q_inside_jokes"></textarea></div>
      <div class="field"><label>Any topics or sensitive subjects I should be aware of, or intentionally avoid?</label><textarea id="q_exclude"></textarea></div>
    `

            ;
        } else if (eventType.includes('corporate')) {
            html += `
      <div class="field"><label>Type of crowd</label>
        <div class="radio-group">${
            radioGroup('q_crowd', ['All adults', 'Mixed group', 'Executives / VIPs'])}</div>
      </div>
      <div class="field"><label>Any VIPs or executives attending?</label><input type="text" id="q_vips"></div>
      <div class="field"><label>Company name / event theme</label><input type="text" id="q_theme"></div>
      <div class="field"><label>Anyone who should NOT be involved?</label><input type="text" id="q_exclude"></div>
      <div class="field"><label>What kind of vibe are you looking for?</label>
        <div class="radio-group">${




            radioGroup('q_vibe', ['Clean elegant & classy', 'Family friendly', 'Light adult humor'])}</div>
      </div>
      <div class="field"><label>Inside jokes, themes, or fun facts I can use?</label><textarea id="q_inside_jokes"></textarea></div>
    `


            ;
        } else if (eventType.includes('graduation')) {
            html += `
      <div class="field"><label>Type of crowd</label>
        <div class="radio-group">${
            radioGroup('q_crowd', ['All adults', 'Include kids', 'Family crowd'])}</div>
      </div>
      <div class="field"><label>Name of the person graduating</label><input type="text" id="q_honoree"></div>
      <div class="field"><label>Their date of birth</label><input type="date" id="q_honoree_dob"></div>
      <div class="field"><label>Anyone you'd like me to definitely involve in the show?</label><input type="text" id="q_special_attention"></div>
      <div class="field"><label>Anyone who should NOT be involved?</label><input type="text" id="q_exclude"></div>
      <div class="field"><label>What kind of vibe are you looking for?</label>
        <div class="radio-group">${





            radioGroup('q_vibe', ['Clean elegant & classy', 'Family friendly', 'Light adult humor', 'Slightly edgy / flirty', 'Bold & edgy'])}</div>
      </div>
      <div class="field"><label>Any other entertainment before or after my show?</label><textarea id="q_other_entertainment"></textarea></div>
      <div class="field"><label>Tell me about the graduate <span class="hint">(personality, hobbies, a funny or embarrassing story, anything most people don't know — I'll use this to personalize the show and a few custom touches)</span></label><textarea id="q_trivia"></textarea></div>
      ${photoField('q_photo_honoree', 'the graduate')}
    `




            ;
        } else if (eventType.includes('baby shower') || eventType.includes('baby')) {
            html += `
      <div class="field"><label>Type of crowd</label>
        <div class="radio-group">${
            radioGroup('q_crowd', ['All adults', 'Family crowd'])}</div>
      </div>
      <div class="field"><label>Name(s) of the parent(s)-to-be</label><input type="text" id="q_honoree"></div>
      <div class="field"><label>Baby's name <span class="hint">(if already decided)</span></label><input type="text" id="q_baby_name"></div>
      <div class="field"><label>Due date</label><input type="date" id="q_due_date"></div>
      <div class="field"><label>Has the gender already been revealed?</label>
        <div class="radio-group">${




            radioGroup('q_gender_revealed', ['Yes', 'No — this IS the reveal', 'Not sharing / surprise'])}</div>
      </div>
      <div class="field"><label>Any VIPs or special people attending?</label><input type="text" id="q_vips"></div>
      <div class="field"><label>Anyone who should NOT be involved?</label><input type="text" id="q_exclude"></div>
      <div class="field"><label>What kind of vibe are you looking for?</label>
        <div class="radio-group">${



            radioGroup('q_vibe', ['Clean elegant & classy', 'Family friendly', 'Light adult humor'])}</div>
      </div>
      <div class="field"><label>Tell me about the parent(s)-to-be <span class="hint">(personality, hobbies, a funny story, anything most people don't know)</span></label><textarea id="q_trivia"></textarea></div>
      ${photoField('q_photo_honoree', 'the parent(s)-to-be')}
    `



            ;
        } else if (eventType.includes('housewarming') || eventType.includes('house warming')) {
            html += `
      <div class="field"><label>Type of crowd</label>
        <div class="radio-group">${
            radioGroup('q_crowd', ['All adults', 'Family crowd', 'Include kids'])}</div>
      </div>
      <div class="field"><label>Name(s) of the host(s)</label><input type="text" id="q_honoree"></div>
      <div class="field"><label>What's the story behind this home? <span class="hint">(optional — first home, upgrade, move from out of state, etc. — a nice detail I can work into the show)</span></label><input type="text" id="q_home_story" placeholder="e.g. first home together, downsized, moved from Chicago"></div>
      <div class="field"><label>Where in the home will the show take place?</label><input type="text" id="q_show_space" placeholder="e.g. living room, backyard patio, open kitchen/living area"></div>
      <div class="field"><label>Any VIPs or special people attending?</label><input type="text" id="q_vips"></div>
      <div class="field"><label>Anyone who should NOT be involved?</label><input type="text" id="q_exclude"></div>
      <div class="field"><label>What kind of vibe are you looking for?</label>
        <div class="radio-group">${
            radioGroup('q_vibe', ['Clean elegant & classy', 'Family friendly', 'Light adult humor', 'Slightly edgy / flirty'])}</div>
      </div>
      <div class="field"><label>Tell me about the host(s) <span class="hint">(personality, hobbies, a funny or embarrassing story, anything most people don't know — I'll use this to personalize the show and a few custom touches)</span></label><textarea id="q_trivia"></textarea></div>
      ${photoField('q_photo_honoree', 'the host(s)')}
      <div class="field"><label>Anything else I should know about the space or the crowd?</label><textarea id="q_anything_else"></textarea></div>
    `
            ;
        } else if (isSenior) {
            html += `
      <div class="field"><label>Who is the show for?</label>
        <div class="radio-group">${
            radioGroup('q_crowd', ['Residents only', 'Residents and their families', 'Residents, families and staff'])}</div>
      </div>
      <div class="field"><label>What is the occasion?</label><input type="text" id="q_occasion" placeholder="e.g. family day, summer social, holiday celebration"></div>
      <div class="field"><label>Roughly how many residents do you expect?</label><input type="text" id="q_resident_count" placeholder="e.g. 30"></div>
      <div class="field"><label>Will children be attending?</label>
        <div class="radio-group">${
            radioGroup('q_kids_present', ['Yes, quite a few', 'A handful', 'No'])}</div>
      </div>
      <div class="field"><label>How will most of the audience be seated?</label>
        <div class="radio-group">${
            radioGroup('q_seating', ['Rows of chairs', 'Around tables', 'Mix of chairs and wheelchairs', 'Not sure yet'])}</div>
      </div>
      <div class="field"><label>Are most residents able to come up front to take part, or should I come to them in their seats?</label>
        <div class="radio-group">${
            radioGroup('q_participation', ['Most can come up', 'Some can, some cannot', 'Best to come to them'])}</div>
      </div>
      <div class="field"><label>Any hearing or vision considerations I should plan around? <span class="hint">(this helps me pace the show and pick the right effects)</span></label><textarea id="q_accessibility"></textarea></div>
      <div class="field"><label>Any residents who would love to be involved? <span class="hint">(names, and anything fun about them — a hobby, a career, a story the room would enjoy)</span></label><textarea id="q_trivia"></textarea></div>
      <div class="field"><label>Anyone who should NOT be singled out or brought into the show?</label><textarea id="q_exclude"></textarea></div>
      <div class="field"><label>Is anyone being celebrated that day? <span class="hint">(a birthday, an anniversary, a long-time resident — optional)</span></label><input type="text" id="q_special_day" placeholder="Name and occasion, if applicable"></div>
      <div class="field"><label>Who should I check in with when I arrive? <span class="hint">(name and mobile, e.g. activities director)</span></label><input type="text" id="q_day_contact" placeholder="Name, phone"></div>
      <div class="field"><label>Any other entertainment or activities before or after my show?</label><textarea id="q_other_entertainment"></textarea></div>
    `
            ;
        } else {
            // General / private celebration
            html += `
      <div class="field"><label>Type of crowd</label>
        <div class="radio-group">${
            radioGroup('q_crowd', ['All adults (mixed)', 'Family crowd', 'Include kids'])}</div>
      </div>
      <div class="field"><label>What is the occasion you are celebrating?</label><input type="text" id="q_occasion" value="${
            (eventType && eventType !== 'other') ? escapeAttr(d.eventType) : ''}"></div>
      <div class="field"><label>Is it someone's special day?</label><input type="text" id="q_special_day" placeholder="Name, if applicable"></div>
      <div class="field"><label>Their date of birth <span class="hint">(if applicable)</span></label><input type="date" id="q_honoree_dob"></div>
      <div class="field"><label>Any VIPs or special people attending?</label><input type="text" id="q_vips"></div>
      <div class="field"><label>Anyone you'd like me to give special attention to in the show?</label><input type="text" id="q_special_attention"></div>
      <div class="field"><label>Anyone who should NOT be involved?</label><input type="text" id="q_exclude"></div>
      <div class="field"><label>What kind of vibe are you looking for?</label>
        <div class="radio-group">${





            radioGroup('q_vibe', ['Clean elegant & classy', 'Family friendly', 'Light adult humor', 'Slightly edgy / flirty', 'Bold & edgy'])}</div>
      </div>
      <div class="field"><label>Any other entertainment before or after my show?</label><textarea id="q_other_entertainment"></textarea></div>
      <div class="field"><label>If there's a guest of honor, tell me about them <span class="hint">(personality, hobbies, a funny story, anything most people don't know — optional)</span></label><textarea id="q_trivia"></textarea></div>
      ${photoField('q_photo_honoree', 'the guest of honor', { hintText: '(optional — Google Drive, Dropbox, or any shareable link, or text it to me at <a href="sms:+16128657681" style="color:#6750a4;text-decoration:none">+1 (612) 865-7681</a>)' })}
    `




            ;
        }
        html += '</div>';

        // Section 3: Logistics
        html += '<div class="section"><div class="section-title">⚡ Logistics</div>';
        html += isSenior ? `
    <div class="field">
      <label>What kind of space will this be in?</label>
      <div class="radio-group">${radioGroup('q_room_type', ['Activity room', 'Dining room', 'Community hall', 'Chapel / auditorium', 'Other'])}</div>
    </div>
    <div class="field">
      <label>Is a microphone and sound system available on site? <span class="hint">(a mic makes a real difference for this audience — I can bring my own if not)</span></label>
      <div class="radio-group">${radioGroup('q_av_available', ['Yes, mic and speakers', 'Speakers only', "Neither, I'll bring my own", 'Not sure yet'])}</div>
    </div>
    <div class="field">
      <label>Is access to a power outlet available?</label>
      <div class="radio-group">${radioGroup('q_power', ['Yes', 'No', 'Not sure'])}</div>
    </div>
  ` : isSchool ? `
    <div class="field">
      <label>What kind of space will this be in?</label>
      <div class="radio-group">${radioGroup('q_room_type', ['Gym', 'Cafeteria', 'Auditorium', 'Classroom', 'Other'])}</div>
    </div>
    <div class="field">
      <label>Is a sound system and projector/screen available on site?</label>
      <div class="radio-group">${radioGroup('q_av_available', ["Yes, both available", "Sound only", "Projector only", "Neither, I'll bring my own", "Not sure yet"])}</div>
    </div>
    <div class="field">
      <label>Name and contact for whoever handles sound/AV at the venue <span class="hint">(so we can coordinate ahead of time)</span></label>
      <input type="text" id="q_av_contact" placeholder="Name, phone or email">
    </div>
  ` : `
    <div class="field">
      <label>Will there be a clear area for the show?</label>
      <div class="radio-group">${

        radioGroup('q_clear_area', ['Yes', 'Somewhat', 'Not sure yet'])}</div>
    </div>
    <div class="field">
      <label>Is access to a power outlet available?</label>
      <div class="radio-group">${


        radioGroup('q_power', ['Yes', 'No', 'Not sure'])}</div>
    </div>
  `;
        html += '</div>';

        html += '<button class="submit-btn" id="submit-btn" onclick="submitIntake(false)">Submit questionnaire</button>';
        html += '<button class="save-draft-btn" id="save-draft-btn" onclick="submitIntake(true)">Save and finish later</button>';

        document.getElementById('form-content').innerHTML = html;
        prefillSavedAnswers(d.savedAnswers || {});
    }

    function prefillSavedAnswers(saved) {
        Object.keys(saved).forEach(function(key) {
            const value = saved[key];
            if (value === null || value === undefined || value === '') return;

            // Radio groups are saved under their group name (e.g. q_vibe), not an element id
            const radioInGroup = document.querySelector('input[name="' + key + '"][value="' + String(value).replace(/"/g, '\\"') + '"]');
            if (radioInGroup) {
                radioInGroup.checked = true;
                onRadioChange(radioInGroup);
                return;
            }

            const field = document.getElementById(key);
            if (field) field.value = value;
        });
    }

    function submitIntake(isDraft) {
        const submitBtn = document.getElementById('submit-btn');
        const draftBtn = document.getElementById('save-draft-btn');
        const activeBtn = isDraft ? draftBtn : submitBtn;
        submitBtn.disabled = true;
        draftBtn.disabled = true;
        activeBtn.textContent = isDraft ? 'Saving...' : 'Submitting...';

        const answers = {};
        document.querySelectorAll('#form-content input, #form-content textarea, #form-content select').forEach(el => {
            if (el.type === 'radio') {
                if (el.checked)
                    answers[el.name] = el.value;
            } else if (el.id) {
                answers[el.id] = el.value;
            }
        });

        fetch('/api/intake', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                action: 'submit',
                bookingId: getBookingId(),
                answers: answers,
                draft: isDraft
            })
        })
        .then(r => r.json())
        .then(data => {
            if (data.error)
                throw new Error(data.error);
            if (isDraft) {
                draftBtn.textContent = '✓ Saved — come back anytime to finish';
                setTimeout(() => {
                    submitBtn.disabled = false;
                    draftBtn.disabled = false;
                    draftBtn.textContent = 'Save and finish later';
                }, 3000);
            } else {
                document.getElementById('main-page').style.display = 'none';
                document.getElementById('success-page').style.display = 'block';
            }
        })
        .catch(e => {
            alert('Something went wrong — please try again.');
            submitBtn.disabled = false;
            draftBtn.disabled = false;
            submitBtn.textContent = 'Submit questionnaire';
            draftBtn.textContent = 'Save and finish later';
        });
    }

    loadBooking();
    </script>
</body>
</html>
